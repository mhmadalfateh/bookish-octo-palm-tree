name: Build and Deploy Qiyas Materials

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Prepare Website
        shell: bash
        run: |
          set -e

          mkdir -p dist extracted

          ZIP_FILE="qiyas-materials-github.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Extracting ZIP file..."

          unzip -o "$ZIP_FILE" -d extracted

          FILE=$(find extracted \
            -type f \
            -name "index.html" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::index.html not found inside ZIP"
            find extracted -type f
            exit 1
          fi

          echo "Found website: $FILE"

          cp "$FILE" dist/index.html

          echo "Website prepared successfully!"

          ls -la dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
