name: Build and Deploy Qiyas Materials

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Prepare Website
        shell: bash
        run: |
          set -e

          mkdir -p dist

          FILE=$(find . \
            -type f \
            -name "index.html" \
            -not -path "./.git/*" \
            -not -path "./dist/*" \
            -not -path "./node_modules/*" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::لم يتم العثور على index.html"
            echo "الملفات الموجودة في المستودع:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "تم العثور على الموقع: $FILE"

          cp "$FILE" dist/index.html

          echo "ملفات الموقع:"
          ls -la dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
